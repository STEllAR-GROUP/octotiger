# Small 3D source-free transport run; refine further for accuracy studies.
runtime.modular.enabled = on
problem.name = NONE
hydro.enabled = off
radiation.enabled = on
gravity.enabled = off
radiation.modular.source_free = on
radiation.modular.problem = streamingGaussian
radiation.opacity.model = legacy
radiation.opacity.constant = 0
radiation.implicit = off
radiation.velocity_terms = off
radiation.subcycling = off
radiation.reduced_light_speed_ratio = 0.5
radiation.cfl = 0.3
radiation.test.width = 7.5e9
radiation.test.background = 1
radiation.test.amplitude = 0.2
units.centimeters = 1
units.seconds = 1
units.grams = 1
mesh.ndim = 3
mesh.scale = 3.0e10
mesh.boundary.periodic = on
mesh.level.minimum = 1
mesh.level.maximum = 1
runtime.stop_time = 0.8
runtime.stop_step = 100000
output.directory = radiation3DOutput
output.interval = 0.1
