# Cold, nonrotating, one-solar-mass WD; the model normalizes M = R = G = 1.
problem=star
eos=wd
gravity=on
hydro=on
radiation=off
omega=0
n_species=1

# dx_finest = 2 * 2.56 / (8 * 2^4) = 0.04: diameter 2 spans 50 cells.
xscale=2.56
min_level=1
max_level=4
unigrid=off
rotating_star_amr=off
ngrids=-1
refinement_floor=1e-5
star_rho_out=1e-10
rho_floor=1e-10
# Suppress roundoff below zero in the cold dual-energy tracer (e_th >= 1e-50).
tau_floor=1e-30

cfl=0.4
theta=0.35
monopole_host_kernel_type=LEGACY
multipole_host_kernel_type=LEGACY
hydro_host_kernel_type=LEGACY
amr_boundary_kernel_type=AMR_LEGACY
monopole_device_kernel_type=OFF
multipole_device_kernel_type=OFF
hydro_device_kernel_type=OFF
number_gpus=0
executors_per_gpu=0

# stop_step is inclusive: indices 0, 1, 2 produce three timesteps.
stop_step=2
stop_time=1
odt=1
silo_num_groups=1
disable_output=off
disable_diagnostics=on
disable_analytic=on
