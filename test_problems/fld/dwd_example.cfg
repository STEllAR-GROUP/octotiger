# Bounded DWD/FLD smoke example. Supply a reviewed scf.init in the run directory.
# Sixteen SCF iterations do not establish equilibrium; production must select
# resolution and an iteration budget from its own convergence assessment.
# This file does not select the stellar masses or donor fill factor.
problem=dwd
eos=wd
hydro=on
gravity=on
radiation=off
fld=on
# Zero incident radiation; implicit diffusion can carry energy out of the box.
fld_boundary=vacuum
fld_material_model=fully_ionized
fld_unit_system=physical
fld_opacity_model=free_free_thomson
fld_opacity_temperature_floor=1e4
fld_gaunt=1
fld_initial_energy=0
fld_initial_pulse=0
fld_tolerance=1e-8
fld_max_iterations=100
fld_max_cycles=200

# Explicit helium composition for this example; choose the physical mixture
# before a science run. WD cold pressure retains its existing mu_e=2 EOS.
n_species=5
atomic_mass=4
atomic_mass=4
atomic_mass=4
atomic_mass=4
atomic_mass=4
atomic_number=2
atomic_number=2
atomic_number=2
atomic_number=2
atomic_number=2
rho_floor=1e-12
scf_rho_floor=1e-12
tau_floor=1e-30

min_level=3
max_level=3
unigrid=on
xscale=1
hard_dt=1e-8
stop_step=1
stop_time=1e-8
disable_output=off
disable_analytic=on
disable_diagnostics=off
scf_output_frequency=256
scf_max_iterations=16
hydro_host_kernel_type=LEGACY
hydro_device_kernel_type=OFF
monopole_host_kernel_type=LEGACY
monopole_device_kernel_type=OFF
multipole_host_kernel_type=LEGACY
multipole_device_kernel_type=OFF

light_curve=on
light_curve_opacity_model=fld
light_curve_interval=1
light_curve_output=light_curve.dat
