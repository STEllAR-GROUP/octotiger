# Staff et al. (2018), arXiv:1806.00337, q=0.7 AMR initial-model family.
# Short undriven evolution of a saved seed; supply --restart_filename.
# This pilot measures startup behavior at the candidate resolution.
problem=dwd
eos=wd
hydro=on
gravity=on
radiation=off
fld=on
fld_boundary=vacuum
fld_material_model=fully_ionized
fld_unit_system=physical
fld_opacity_model=free_free_thomson
fld_opacity_temperature_floor=1e4
fld_gaunt=1
fld_initial_energy=0
fld_initial_pulse=0
fld_tolerance=1e-8
# Match the saved seed's solver budget; keep the accuracy tolerance unchanged.
fld_max_iterations=150
fld_max_cycles=200

# Standard slots: accretor core/envelope, donor core/envelope, vacuum.
# core_frac1=core_frac2=1 in scf.init leaves both envelope tracers zero.
# Both accretor slots carry 50/50-by-mass C/O moments for future use.
# A=96/7, Z=48/7, <Z^2>=48; the last is deliberately not Z*Z.
n_species=5
atomic_mass=13.714285714285714
atomic_mass=13.714285714285714
atomic_mass=4
atomic_mass=4
atomic_mass=4
atomic_number=6.857142857142857
atomic_number=6.857142857142857
atomic_number=2
atomic_number=2
atomic_number=2
atomic_number_squared=48
atomic_number_squared=48
atomic_number_squared=4
atomic_number_squared=4
atomic_number_squared=4
rho_floor=1e-12
scf_rho_floor=1e-12
tau_floor=1e-30

# No angular-momentum or entropy forcing. Contact is set by fill2=1 in scf.init.
driving_rate=0
driving_time=0
entropy_driving_rate=0
entropy_driving_time=0

min_level=3
max_level=3
unigrid=on
xscale=1
cfl=0.4
hard_dt=-1
stop_step=19
odt=0.01
disable_output=off
disable_analytic=on
disable_diagnostics=off
scf_output_frequency=1024
scf_max_iterations=1024
scf_tolerance=1e-6
scf_min_iterations=25
scf_stable_iterations=5

# CPU kernels; choose HPX workers and CPU affinity within the shared allocation.
hydro_host_kernel_type=LEGACY
hydro_device_kernel_type=OFF
monopole_host_kernel_type=LEGACY
monopole_device_kernel_type=OFF
multipole_host_kernel_type=LEGACY
multipole_device_kernel_type=OFF
light_curve=off
