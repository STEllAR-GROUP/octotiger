# Independent 2D run through the modular HPX node driver (no legacy 3D grid).
# Equal min/max levels give a uniform tiled mesh; increase maximum by one
# to exercise the fixed lower-corner coarse/fine interface benchmark.
problem.name = NONE
hydro.modular.enabled = on
hydro.modular.problem = kelvinHelmholtz
hydro.enabled = on
hydro.gamma = 1.4
hydro.cfl = 0.25
gravity.enabled = off
radiation.enabled = off
mesh.ndim = 2
mesh.scale = 0.5
mesh.boundary.periodic = on
mesh.level.minimum = 3
mesh.level.maximum = 3
runtime.stop_time = 2.0
runtime.stop_step = 100000
output.directory = kelvinHelmholtzOutput
output.interval = 0.05
