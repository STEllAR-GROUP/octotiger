# Radiation-only model verification. All parameters are physical code units.
problem.name=RADIATION_STREAMING_FRONT
radiation.enabled=on
hydro.enabled=off
gravity.enabled=off
mesh.omega_z=0
mesh.boundary.periodic=on
radiation.implicit=off
mesh.unigrid=on
mesh.level.maximum=2
mesh.level.minimum=2
mesh.scale=1
hydro.cfl=0.4
runtime.stop_time=0.2
runtime.stop_step=100000
output.interval=1
output.disabled=on
runtime.disable_diagnostics=on
problem.disable_analytic=off
execution.kernel.hydro.host=LEGACY
execution.kernel.hydro.device=OFF
execution.kernel.monopole.device=OFF
execution.kernel.multipole.device=OFF
radiation.test.extinction=5
radiation.test.width=0.2
radiation.test.background=1
radiation.test.amplitude=0.01
radiation.test.luminosity=0.01
