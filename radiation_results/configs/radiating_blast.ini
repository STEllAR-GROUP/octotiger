# Cartesian adaptation of Ensman (1994); see ../ENSMAN.md.
# CGS units, physical c. Full benchmark durations are expensive with explicit transport.
problem=RADIATION_BLAST_WAVE
radiation=on
hydro=on
gravity=off
rad_implicit=on
omega=0
periodic=off
reflect_bc=off
inflow_bc=off
unigrid=on
max_level=2
min_level=2
xscale=10000000000000
code_to_g=1
code_to_cm=1
code_to_s=1
eos=IDEAL
n_species=1
atomic_mass=1
atomic_number=1
cfl=0.4
stop_time=22000
odt=22000
disable_output=on
disable_diagnostics=on
disable_analytic=on
correct_am_hydro=off
hydro_host_kernel_type=LEGACY
hydro_device_kernel_type=OFF
monopole_device_kernel_type=OFF
multipole_device_kernel_type=OFF
